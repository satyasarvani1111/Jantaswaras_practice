<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All the Best — Janta Swaras Practice</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="notation-fix.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Music Pandit</p>
      <h1>Janta Swaras Practice</h1>
      <p class="subtitle">Practice at your pace with tala and Tanpura support.</p>
    </header>

    <section class="card controls" aria-label="Lesson controls">
      <label>Lesson <select id="lessonSelect" aria-label="Select lesson"><option value="1">Janta 1</option><option value="2">Janta 2</option><option value="3">Janta 3</option><option value="4">Janta 4</option><option value="5">Janta 5</option><option value="6">Janta 6</option></select></label>
      <label>Speed <select id="speedSelect" aria-label="Select speed"><option value="1">1st speed</option><option value="2">2nd speed</option><option value="3">3rd speed</option></select></label>
      <button id="playBtn" type="button">▶ Play</button>
      <button id="restartBtn" type="button" class="secondary">↺ Restart</button>
    </section>

    <section class="card tanpura" aria-label="Tanpura controls">
      <div><h2>Tanpura</h2><p>Runs independently while you practise.</p></div>
      <label>Shruti <select id="shrutiSelect" aria-label="Select Tanpura shruti"><option>C</option><option>C#</option><option>D</option><option>D#</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>G#</option><option>A</option><option>A#</option><option>B</option></select></label>
      <label class="volume">Volume <input id="tanpuraVolume" type="range" min="0" max="100" value="60"><output id="volumeValue">60%</output></label>
      <button id="tanpuraBtn" type="button">▶ Start Tanpura</button>
    </section>

    <section class="card notation-card">
      <div class="notation-heading"><div><p class="eyebrow">Current lesson</p><h2 id="lessonTitle">Janta 1</h2></div><p id="speedHint">1st speed · 1 swara per beat</p></div>
      <div class="notation-grid">
        <div><h3>Aarohanam</h3><div id="notation" class="notation" aria-live="polite"></div></div>
        <div><h3>Avarohanam</h3><div id="previewNotation" class="notation" aria-live="polite"></div></div>
      </div>
    </section>

    <section class="card tala" aria-label="Tala at 60 beats per minute">
      <div><h2>Tala</h2><p>Fixed at 60 BPM</p></div>
      <div class="beats" aria-label="Eight tala beats"><span class="beat">1</span><span class="beat">2</span><span class="beat">3</span><span class="beat">4</span><span class="beat">5</span><span class="beat">6</span><span class="beat">7</span><span class="beat">8</span></div>
    </section>
    <div class="progress-track" aria-label="Lesson audio progress"><div id="progressBar"></div></div>
    <p id="audioMessage" class="audio-message" role="status"></p>
  </main>
  <audio id="audioPlayer" preload="metadata"></audio>
  <audio id="tanpuraPlayer" preload="metadata" loop></audio>
  <script src="script.js"></script>
</body>
</html>
