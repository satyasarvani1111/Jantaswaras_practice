<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Janta Swaras Practice</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<<div class="header">

    <h1>Janta Swaras Practice</h1>

    <p>Music Pandit</p>

</div>





<div class="container">



<!-- =========================
     AAROHANAM
========================= -->

<div class="notation-panel">

    <h2>Aarohanam</h2>


    <div id="notation">

    </div>


</div>







<!-- =========================
     AVAROHANAM
========================= -->

<div class="notation-panel">

    <h2>Avarohanam</h2>


    <div id="previewNotation">

    </div>


</div>







<!-- =========================
     CONTROLS
========================= -->

<div class="control-panel">



<div class="card">


<label>
Select Janta
</label>


<select id="lessonSelect">


<option value="1">
Janta 1
</option>


<option value="2">
Janta 2
</option>


<option value="3">
Janta 3
</option>


<option value="4">
Janta 4
</option>


<option value="5">
Janta 5
</option>


<option value="6">
Janta 6
</option>


</select>


</div>







<div class="card">


<label>
Speed
</label>


<select id="speedSelect">


<option value="1">
1st Speed
</option>


<option value="2">
2nd Speed
</option>


<option value="3">
3rd Speed
</option>


</select>


</div>








<div class="card button-group">


<button id="playBtn">

▶ Play

</button>



<button id="restartBtn">

↻ Restart

</button>


</div>








<div class="card">


<div class="progress-container">


<div id="progressBar">

</div>


</div>


</div>







<div class="card">


<div id="tala">


<div class="beat">1</div>

<div class="beat">2</div>

<div class="beat">3</div>

<div class="beat">4</div>

<div class="beat">5</div>

<div class="beat">6</div>

<div class="beat">7</div>

<div class="beat">8</div>


</div>


</div>






</div>


</div>








<audio id="audioPlayer">

</audio>





<script src="script.js"></script>


</body>

</html>
